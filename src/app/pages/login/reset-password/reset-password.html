<main class="reset-password-shell">
  <app-header />

  <section class="reset-password-content">
    <article class="reset-password-card">
      <a class="reset-password-card__back" routerLink="/login" aria-label="Zurück zur Anmeldung">
        <span aria-hidden="true"></span>
      </a>

      <h1>Passwort zurücksetzen</h1>

      <form class="reset-password-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <label class="reset-password-field">
          <span class="visually-hidden">Neues Passwort</span>
          <input
            id="new-password"
            formControlName="password"
            type="password"
            autocomplete="new-password"
            placeholder="Neues Passwort"
            aria-describedby="reset-password-error"
            (input)="clearSubmitError()"
          />
        </label>

        <label class="reset-password-field">
          <span class="visually-hidden">Neues Kennwort bestätigen</span>
          <input
            id="confirm-password"
            formControlName="confirmation"
            type="password"
            autocomplete="new-password"
            placeholder="Neues Kennwort bestätigen"
            aria-describedby="reset-password-error"
            (input)="clearSubmitError()"
          />
        </label>

        <p
          id="reset-password-error"
          class="reset-password-form__error"
          [class.reset-password-form__error--visible]="errorMessage()"
          aria-live="polite"
        >
          {{ errorMessage() }}
        </p>

        <button
          class="reset-password-form__submit"
          [class.reset-password-form__submit--disabled]="formDisabled() || resetPending()"
          type="submit"
          [disabled]="formDisabled() || resetPending()"
          [attr.aria-disabled]="formDisabled() || resetPending()"
        >
          {{ resetPending() ? 'Wird geändert …' : 'Passwort ändern' }}
        </button>
      </form>
    </article>
  </section>

  <footer class="reset-password-footer">
    <a routerLink="/impressum">Impressum</a>
    <a routerLink="/datenschutz">Datenschutz</a>
  </footer>
</main>

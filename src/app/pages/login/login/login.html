<main class="login-shell">
  <header>
    <div class="login-shell__topbar">
      <div class="login-shell__brand" role="img" aria-label="DABubble">
        <img class="login-shell__icon" src="img/Logo.png" alt="" width="70" height="70" />
        <img
          class="login-shell__wordmark"
          src="img/dabubble-wordmark.svg"
          alt=""
          width="156"
          height="24"
        />
      </div>

      <div class="login-shell__auth">
        <span>Neu bei DABubble?</span>
        <a [routerLink]="['/register']">Konto erstellen</a>
      </div>
    </div>
  </header>
  <section class="login-formfield">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <h1>Anmeldung</h1>
      <p>Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.</p>

      <label
        class="input-pill"
        [class.input-pill--error]="form.get('email')?.invalid && form.get('email')?.touched"
      >
        <input formControlName="email" type="email" placeholder="beispielname@email.com" />
      </label>
      <div class="error-slot">
        <span
          class="error-text"
          [class.error-text--visible]="form.get('email')?.invalid && form.get('email')?.touched"
        >
          *Diese E-Mail-Adresse ist leider ungültig.
        </span>
      </div>

      <label
        class="input-pill"
        [class.input-pill--error]="form.get('password')?.invalid && form.get('password')?.touched"
      >
        <input formControlName="password" type="password" placeholder="Passwort" />
      </label>
      <div class="error-slot">
        <span
          class="error-text"
          [class.error-text--visible]="
            form.get('password')?.invalid && form.get('password')?.touched
          "
        >
          Falsches Passwort oder E-Mail.. Bitte noch einmal versuchen.
        </span>
      </div>

      <a [routerLink]="['/password-reset']">Passwort vergessen?</a>

      <div class="divider">ODER</div>

      <button type="button" class="btn-google" (click)="loginWithGoogle()">
        <img src="icons/google.svg" alt="" />
        Anmelden mit Google
      </button>

      <div class="actions">
        <button class="btn-primary" type="submit">Anmelden</button>
        <button class="btn-secondary" type="button" (click)="loginAsGuest()">Gäste-Login</button>
      </div>
    </form>
  </section>

  <footer class="login-shell__footer">
    <a [routerLink]="['/impressum']">Impressum</a>
    <a [routerLink]="['/datenschutz']">Datenschutz</a>
  </footer>
</main>

<main class="password-reset-shell">
  <app-header />

  <section class="password-reset-content">
    <form class="password-reset-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <a
        class="password-reset-card__back"
        [routerLink]="['/login']"
        aria-label="Zurück zur Anmeldung"
      >
        <span aria-hidden="true"></span>
      </a>

      <div class="password-reset-card__heading">
        <h1>Passwort zurücksetzen</h1>
        <p>Bitte geben Sie Ihre E-Mail-Adresse ein.</p>
      </div>

      <label class="reset-field" [class.reset-field--error]="emailHasError()">
        <img class="reset-field__icon" src="/icons/mail.svg" alt="" />
        <input
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="beispielname@email.com"
          aria-label="E-Mail-Adresse"
          aria-describedby="reset-email-error"
          (input)="clearSubmitState()"
        />
      </label>

      <p
        id="reset-email-error"
        class="password-reset-card__error"
        [class.password-reset-card__error--visible]="emailHasError() || submitError()"
        aria-live="polite"
      >
        {{ submitError() || 'Diese E-Mail-Adresse ist leider ungültig.' }}
      </p>

      <p class="password-reset-card__hint">
        Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.
      </p>

      <button
        class="password-reset-card__submit"
        type="submit"
        [disabled]="form.invalid || resetPending()"
      >
        {{ resetPending() ? 'Wird gesendet …' : 'E-Mail senden' }}
      </button>
    </form>
  </section>

  <footer class="password-reset-footer">
    <a [routerLink]="['/impressum']">Impressum</a>
    <a [routerLink]="['/datenschutz']">Datenschutz</a>
  </footer>

  <div
    class="password-reset-toast"
    [class.password-reset-toast--visible]="resetSent()"
    role="status"
    aria-live="polite"
  >
    <span class="material-symbols-outlined" aria-hidden="true">mail</span>
    E-Mail gesendet
  </div>
</main>

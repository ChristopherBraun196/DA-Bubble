<main>
  <app-header />
  <section class="mw-1440">
    <div>
      <button><<<-</button>
      <h1>Passwort zurücksetzen</h1>
      <p>Bitte geben Sie Ihre E-Mail-Adresse ein.</p>
    </div>

    <label
      class="input-pill"
      [class.input-pill--error]="form.get('email')?.invalid && form.get('email')?.touched"
    >
      <img class="input-pill__icon input-pill__icon--email" src="/icons/mail.svg" alt="" />
      <input
        formControlName="email"
        type="email"
        placeholder="beispielname@email.com"
        (input)="clearLoginError()"
      />
    </label>
    <div class="error-slot">
      <span
        class="error-text"
        [class.error-text--visible]="form.get('email')?.invalid && form.get('email')?.touched"
      >
        *Diese E-Mail-Adresse ist leider ungültig.
      </span>
    </div>

    <span>Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.</span>

    <button>E-Mail senden</button>
  </section>
</main>

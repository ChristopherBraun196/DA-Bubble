<main class="password-reset-shell">
  <app-header />
  <section class="password-reset-formfield">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="password-reset-topbar">
        <a class="back-button" [routerLink]="['/login']">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
      </div>

      <h1>Passwort zurücksetzen</h1>
      <p>Bitte geben Sie Ihre E-Mail-Adresse ein.</p>

      <label
        class="input-pill"
        [class.input-pill--error]="form.get('email')?.invalid && form.get('email')?.touched"
      >
        <input formControlName="email" type="email" placeholder="beispielname@email.com" />
      </label>
      <div class="error-slot">
        <span
          class="error-text"
          [class.error-text--visible]="form.get('email')?.invalid && form.get('email')?.touched"
        >
          Diese E-Mail-Adresse ist leider ungültig.
        </span>
      </div>

      <button class="btn-primary" type="submit">Link senden</button>
    </form>
  </section>
</main>

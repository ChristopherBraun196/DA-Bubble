@if (message(); as message) {
  <article class="message" [class.message--own]="ownMessage()">
    <img appAvatarFallback class="message__avatar" [src]="message.authorPhotoURL" alt="" />

    <div class="message__content">
      <div class="message__meta">
        <strong class="message__author">{{ message.authorName }}</strong>
        @if (message.createdAt; as createdAt) {
          <time class="message__time" [attr.datetime]="createdAt.toDate().toISOString()">
            {{ createdAt.toDate() | date: 'HH:mm' }} Uhr
          </time>
        }
      </div>

      @if (editing()) {
        <div class="message__edit">
          <textarea
            class="message__edit-input"
            rows="3"
            aria-label="Nachricht bearbeiten"
            [value]="draft()"
            (input)="updateDraft($event)"
          ></textarea>

          <div class="message__edit-actions">
            <button class="message__edit-emoji" type="button" aria-label="Emoji einfügen">
              <span class="material-symbols-outlined">sentiment_satisfied</span>
            </button>

            <button
              class="message__edit-button message__edit-button--ghost"
              type="button"
              (click)="cancelEdit()"
            >
              Abbrechen
            </button>
            <button
              class="message__edit-button message__edit-button--solid"
              type="button"
              (click)="saveEdit()"
            >
              Speichern
            </button>
          </div>
        </div>
      } @else {
        <p class="message__bubble">{{ message.text }}</p>
        <app-message-reactions
          [reactions]="message.reactions"
          [currentUserId]="currentUserId()"
          (toggled)="toggleReaction($event)"
        />
      }
    </div>

    @if (!editing()) {
      <div
        class="message__actions"
        [class.message__actions--open]="menuOpen() || reactionPickerOpen()"
      >
        <button
          class="message__action"
          type="button"
          aria-label="Mit Haken reagieren"
          (click)="toggleReaction('✅')"
        >
          <span class="message__emoji">✅</span>
        </button>
        <button
          class="message__action"
          type="button"
          aria-label="Mit Hände hoch reagieren"
          (click)="toggleReaction('🙌')"
        >
          <span class="message__emoji">🙌</span>
        </button>

        <div class="message__reaction-picker-wrap" #reactionPickerWrap>
          <button
            class="message__action"
            type="button"
            aria-label="Reaktion hinzufügen"
            [attr.aria-expanded]="reactionPickerOpen()"
            (click)="toggleReactionPicker()"
          >
            <span class="material-symbols-outlined">add_reaction</span>
          </button>

          @if (reactionPickerOpen()) {
            <app-emoji-picker
              class="message__reaction-picker"
              (selected)="toggleReaction($event)"
            />
          }
        </div>

        <button class="message__action" type="button" aria-label="Thread öffnen">
          <span class="material-symbols-outlined">comment</span>
        </button>

        @if (ownMessage()) {
          <div class="message__menu-wrap" #menuWrap>
            <button
              class="message__action"
              type="button"
              aria-label="Weitere Optionen"
              [attr.aria-expanded]="menuOpen()"
              (click)="toggleMenu()"
            >
              <span class="material-symbols-outlined">more_vert</span>
            </button>

            @if (menuOpen()) {
              <div class="message__menu">
                <button class="message__menu-item" type="button" (click)="startEdit()">
                  Nachricht bearbeiten
                </button>
              </div>
            }
          </div>
        }
      </div>
    }
  </article>
}

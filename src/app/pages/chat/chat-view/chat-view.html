<div class="chat">
  @if (activeChat(); as chat) {
    <app-chat-header
      [channelName]="chat.name"
      (directMessageRequested)="directMessageRequested.emit($event)"
    />

    <div class="chat__messages">
      <app-message-list
        [messages]="messages.messages()"
        [currentUserId]="auth.currentUser()?.uid || null"
        [loading]="messages.loading()"
        [error]="messages.error()"
        (messageEdited)="editMessage($event)"
        (reactionToggled)="toggleReaction($event)"
      />
    </div>

    <div class="chat__input">
      <app-message-input
        [placeholder]="placeholder()"
        [disabled]="sending()"
        (messageSent)="sendMessage($event)"
      />
    </div>
  } @else {
    <div class="chat__empty">
      @if (chats.loading()) {
        <p>Channels werden geladen …</p>
      } @else {
        <p>Wähle einen Channel aus oder erstelle einen neuen.</p>
      }
    </div>
  }
</div>

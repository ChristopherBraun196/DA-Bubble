<form class="message-input" (submit)="$event.preventDefault(); submitMessage()">
  <textarea
    #messageField
    class="message-input__field"
    name="message"
    rows="2"
    [placeholder]="placeholder()"
    [attr.aria-label]="placeholder()"
    [disabled]="disabled()"
    [value]="message()"
    (input)="updateMessage($event)"
    (keydown)="handleKeydown($event)"
  ></textarea>

  <div class="message-input__actions">
    @if (mentionOpen()) {
      <app-mention-dropdown
        class="message-input__mention-dropdown"
        [entries]="userEntries()"
        [search]="mentionSearch()"
        (selected)="selectMention($event)"
      />
    } @else if (channelOpen()) {
      <app-mention-dropdown
        class="message-input__mention-dropdown message-input__mention-dropdown--channels"
        [entries]="channelEntries()"
        [search]="channelSearch()"
        (selected)="selectChannel($event)"
      />
    }

    @if (emojiPickerOpen()) {
      <div class="message-input__emoji-picker" role="listbox" aria-label="Emoji auswählen">
        @for (emoji of emojis; track emoji) {
          <button
            class="message-input__emoji"
            type="button"
            role="option"
            [attr.aria-label]="emoji + ' einfügen'"
            (click)="insertEmoji(emoji)"
          >
            {{ emoji }}
          </button>
        }
      </div>
    }

    <button
      class="message-input__icon"
      type="button"
      aria-label="Emoji einfügen"
      aria-haspopup="listbox"
      [attr.aria-expanded]="emojiPickerOpen()"
      [disabled]="disabled()"
      (click)="toggleEmojiPicker()"
    >
      <span class="material-symbols-outlined">sentiment_satisfied</span>
    </button>
    <button
      class="message-input__icon"
      type="button"
      aria-label="Person erwähnen"
      aria-haspopup="listbox"
      [attr.aria-expanded]="mentionOpen()"
      [disabled]="disabled()"
      (click)="openMentionPicker()"
    >
      <span class="material-symbols-outlined">alternate_email</span>
    </button>

    <button
      class="message-input__send"
      type="submit"
      aria-label="Senden"
      [disabled]="disabled() || sendDisabled() || !message().trim()"
    >
      <span class="material-symbols-outlined">send</span>
    </button>
  </div>
</form>

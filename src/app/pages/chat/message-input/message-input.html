<form class="message-input" (submit)="$event.preventDefault(); submitMessage()">
  <textarea
    class="message-input__field"
    name="message"
    rows="2"
    [placeholder]="placeholder()"
    [attr.aria-label]="placeholder()"
    [disabled]="disabled()"
    [value]="message()"
    (input)="updateMessage($event)"
    (keydown)="handleKeydown($event)"
  ></textarea>

  <div class="message-input__actions">
    <button class="message-input__icon" type="button" aria-label="Emoji einfügen">
      <span class="material-symbols-outlined">sentiment_satisfied</span>
    </button>
    <button class="message-input__icon" type="button" aria-label="Person erwähnen">
      <span class="material-symbols-outlined">alternate_email</span>
    </button>

    <button
      class="message-input__send"
      type="submit"
      aria-label="Senden"
      [disabled]="disabled() || sendDisabled() || !message().trim()"
    >
      <span class="material-symbols-outlined">send</span>
    </button>
  </div>
</form>

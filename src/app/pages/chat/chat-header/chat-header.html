<header class="chat-header">
  <button class="chat-header__channel" type="button">
    <span class="material-symbols-outlined chat-header__hash">tag</span>
    <span class="chat-header__name">{{ channelName() }}</span>
    <span class="material-symbols-outlined">expand_more</span>
  </button>

  <div class="chat-header__members">
    <button
      class="chat-header__avatars"
      type="button"
      aria-label="Mitglieder anzeigen"
      [attr.aria-expanded]="membersOpen()"
      (click)="toggleMembers()"
    >
      @for (member of members(); track member) {
        <img class="chat-header__avatar" [src]="member" alt="" />
      }
      <span class="chat-header__count">{{ members().length }}</span>
    </button>

    <button class="chat-header__add" type="button" aria-label="Mitglieder hinzufügen">
      <span class="material-symbols-outlined">person_add</span>
    </button>

    @if (membersOpen()) {
      <div class="chat-header__dialog">
        <app-members-dialog (closed)="closeMembers()" />
      </div>
    }
  </div>
</header>

@if (membersOpen()) {
  <div class="chat-header__backdrop" (click)="closeMembers()"></div>
}

<header class="chat-header">
  <button
    class="chat-header__channel"
    type="button"
    [attr.aria-expanded]="dialog() === 'channel'"
    (click)="toggleChannel()"
  >
    <span class="material-symbols-outlined chat-header__hash">tag</span>
    <span class="chat-header__name">{{ channelName() }}</span>
    <span class="material-symbols-outlined">expand_more</span>
  </button>

  @if (dialog() === 'channel') {
    <div class="chat-header__dialog chat-header__dialog--left">
      <app-channel-info [channelName]="channelName()" (closed)="closeDialog()" />
    </div>
  }

  <div class="chat-header__members">
    <button
      class="chat-header__avatars"
      type="button"
      aria-label="Mitglieder anzeigen"
      [attr.aria-expanded]="dialog() === 'members'"
      (click)="toggleMembers()"
    >
      @for (avatar of memberAvatars(); track avatar) {
        <img class="chat-header__avatar" [src]="avatar" alt="" />
      }
      <span class="chat-header__count">{{ memberCount() }}</span>
    </button>

    <button
      class="chat-header__add"
      type="button"
      aria-label="Mitglieder hinzufügen"
      (click)="openAdd()"
    >
      <span class="material-symbols-outlined">person_add</span>
    </button>

    @if (dialog() === 'members' || dialog() === 'add') {
      <div class="chat-header__dialog">
        @if (dialog() === 'members') {
          <app-members-dialog
            [channelMembers]="channelMembers.members()"
            [currentUserId]="auth.currentUser()?.uid || null"
            (closed)="closeDialog()"
            (addRequested)="openAdd()"
          />
        } @else {
          <app-add-members [channelName]="channelName()" (closed)="closeDialog()" />
        }
      </div>
    }
  </div>
</header>

@if (dialog() !== 'none') {
  <div class="chat-header__backdrop" (click)="closeDialog()"></div>
}

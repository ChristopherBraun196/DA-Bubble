<div
  class="add-members"
  role="dialog"
  aria-modal="true"
  aria-labelledby="add-members-title"
  (click)="$event.stopPropagation()"
>
  <div class="add-members__handle" aria-hidden="true"><span></span></div>

  <header class="add-members__header">
    <h2 class="add-members__title" id="add-members-title">Leute hinzufügen</h2>
    <button class="add-members__close" type="button" aria-label="Schließen" (click)="closed.emit()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </header>

  <form class="add-members__form" (submit)="$event.preventDefault(); add()">
    <div class="add-members__search">
      <div class="add-members__field" [class.add-members__field--selected]="selected().length">
        @for (person of selected(); track person.uid) {
          <span class="add-members__chip">
            <img
              appAvatarFallback
              class="add-members__chip-avatar"
              [src]="person.photoURL"
              alt=""
            />
            <span class="add-members__chip-name">{{ person.displayName }}</span>
            <button
              class="add-members__chip-remove"
              type="button"
              [attr.aria-label]="person.displayName + ' entfernen'"
              (click)="removePerson(person.uid)"
            >
              <span class="material-symbols-outlined">close</span>
            </button>
          </span>
        }

        <input
          class="add-members__input"
          name="person-name"
          type="text"
          autocomplete="off"
          aria-label="Name eingeben"
          [placeholder]="selected().length ? '' : 'Name eingeben'"
          [value]="searchTerm()"
          (input)="updateSearchTerm($event)"
        />
      </div>

      @if (suggestions().length) {
        <ul class="add-members__suggestions">
          @for (person of suggestions(); track person.uid) {
            <li>
              <button class="add-members__suggestion" type="button" (click)="selectPerson(person)">
                <span class="add-members__suggestion-avatar">
                  <img appAvatarFallback [src]="person.photoURL" alt="" />
                  <span class="add-members__suggestion-status" aria-hidden="true"></span>
                </span>
                <span>{{ person.displayName }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>

    @if (addError()) {
      <p class="add-members__error">{{ addError() }}</p>
    }

    <button class="add-members__submit" type="submit" [disabled]="!canAdd() || adding()">
      {{ adding() ? 'Wird gespeichert …' : 'Hinzufügen' }}
    </button>
  </form>
</div>

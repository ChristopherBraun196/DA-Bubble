<header class="thread-header">
  <div class="thread-header__titles">
    <h2 class="thread-header__title">Thread</h2>
    <span class="thread-header__channel">
      <span class="material-symbols-outlined">
        {{ directMessage() ? 'alternate_email' : 'tag' }}
      </span>
      {{ channelName() }}
    </span>
  </div>

  <button
    class="thread-header__close"
    type="button"
    aria-label="Thread schließen"
    (click)="closed.emit()"
  >
    <span class="material-symbols-outlined">close</span>
  </button>
</header>

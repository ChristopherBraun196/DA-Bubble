<div class="thread">
  <app-thread-header [channelName]="channelName()" (closed)="closed.emit()" />

  <!-- Nachrichten kommen spaeter aus Firebase. -->
  <div class="thread__messages"></div>

  <form class="thread__reply" (submit)="$event.preventDefault()">
    <textarea
      class="thread__reply-input"
      name="thread-reply"
      rows="2"
      placeholder="Antworten..."
      aria-label="Antwort schreiben"
    ></textarea>

    <div class="thread__reply-actions">
      <button class="thread__reply-icon" type="button" aria-label="Emoji einfügen">
        <span class="material-symbols-outlined">sentiment_satisfied</span>
      </button>
      <button class="thread__reply-icon" type="button" aria-label="Person erwähnen">
        <span class="material-symbols-outlined">alternate_email</span>
      </button>

      <button class="thread__reply-send" type="submit" aria-label="Senden">
        <span class="material-symbols-outlined">send</span>
      </button>
    </div>
  </form>
</div>

<div class="thread">
  <app-thread-header [channelName]="channelName()" (closed)="closed.emit()" />

  <div class="thread__messages">
    @if (thread.parent(); as parent) {
      <app-message-item
        [message]="parent"
        [ownMessage]="parent.authorId === currentUserId()"
        [currentUserId]="currentUserId()"
        [inThread]="true"
        (edited)="editMessage({ id: parent.id, text: $event })"
        (reactionToggled)="toggleReaction({ id: parent.id, emoji: $event })"
      />

      <div class="thread__divider">
        <span>{{ replyLabel() }}</span>
      </div>

      <app-message-list
        [messages]="thread.replies()"
        [currentUserId]="currentUserId()"
        [loading]="thread.loading()"
        [error]="thread.error()"
        [inThread]="true"
        emptyText=""
        (messageEdited)="editMessage($event)"
        (reactionToggled)="toggleReaction($event)"
      />
    } @else if (thread.error()) {
      <p class="thread__status thread__status--error">{{ thread.error() }}</p>
    } @else if (thread.loading()) {
      <p class="thread__status">Thread wird geladen …</p>
    } @else {
      <p class="thread__status">Diese Nachricht ist nicht mehr verfügbar.</p>
    }
  </div>

  <div class="thread__input">
    <app-message-input
      placeholder="Antworten..."
      [disabled]="sending()"
      (messageSent)="sendReply($event)"
    />
  </div>
</div>

<div class="shell">
  <app-topbar />

  <div
    class="shell__workspace"
    [class.shell__workspace--devspace-closed]="!devspaceOpen()"
    [class.shell__workspace--thread-closed]="!threadOpen()"
  >
    <aside
      id="devspace-navigation"
      class="shell__devspace"
      [attr.aria-hidden]="!devspaceOpen()"
      [attr.inert]="!devspaceOpen() ? '' : null"
    >
      <app-devspace-nav />
    </aside>

    <main class="shell__chat">
      <app-chat-view />
    </main>

    @if (threadOpen()) {
      <aside class="shell__thread">
        <app-thread-panel (closed)="closeThread()" />
      </aside>
    }

    <button
      class="shell__devspace-toggle"
      type="button"
      aria-controls="devspace-navigation"
      [attr.aria-expanded]="devspaceOpen()"
      (click)="toggleDevspace()"
    >
      <span class="material-symbols-outlined">
        {{ devspaceOpen() ? 'left_panel_close' : 'left_panel_open' }}
      </span>
      <span class="shell__devspace-toggle-text">
        Workspace-Menü {{ devspaceOpen() ? 'schließen' : 'öffnen' }}
      </span>
    </button>

    @if (!threadOpen()) {
      <button
        class="shell__thread-toggle"
        type="button"
        aria-label="Thread öffnen"
        (click)="toggleThread()"
      >
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
    }
  </div>
</div>

<header class="topbar">
  <a class="topbar__logo" href="/main" aria-label="DABubble Startseite">
    <img src="/img/Logo.png" alt="" />
    <span class="topbar__logo-text">DABubble</span>
  </a>

  <div class="topbar__search">
    <input
      class="topbar__search-input"
      type="search"
      name="devspace-search"
      placeholder="Devspace durchsuchen"
      aria-label="Devspace durchsuchen"
    />
    <button class="topbar__search-button" type="button" aria-label="Suchen">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path
          d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"
          fill="currentColor"
        />
      </svg>
    </button>
  </div>

  <button class="topbar__user" type="button">
    <span class="topbar__user-name">{{ userName() }}</span>
    <img class="topbar__user-avatar" [src]="userAvatar()" [alt]="userName()" />
    <svg class="topbar__user-chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M7 10l5 5 5-5H7Z" fill="currentColor" />
    </svg>
  </button>
</header>

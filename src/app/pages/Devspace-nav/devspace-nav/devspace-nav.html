<nav class="devspace">
  <header class="devspace__header">
    <div class="devspace__brand">
      <img class="devspace__logo" src="/img/Devspace_logo.png" alt="" />
      <span class="devspace__title">Devspace</span>
    </div>

    <button
      class="devspace__compose"
      type="button"
      aria-label="Neue Nachricht schreiben"
      (click)="startCompose()"
    >
      <span class="material-symbols-outlined">edit_square</span>
    </button>
  </header>

  @if (searchVisible()) {
    <app-workspace-search
      (messageSelected)="messageSelected.emit($event)"
      (channelSelected)="channelSelected.emit($event)"
      (directMessageRequested)="directMessageRequested.emit($event)"
    />
  }

  <app-channel-list
    [activeChannelId]="activeChannelId()"
    (channelSelected)="selectChannel($event)"
  />

  <app-direct-message-list
    [activeUserId]="activeUserId()"
    [temporaryUser]="temporaryUser()"
    (userSelected)="selectUser($event)"
  />
</nav>

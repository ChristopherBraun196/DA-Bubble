<section class="channel-list">
  <header class="channel-list__header">
    <button
      class="channel-list__toggle"
      type="button"
      [attr.aria-expanded]="expanded()"
      (click)="toggle()"
    >
      <span
        class="material-symbols-outlined channel-list__chevron"
        [class.channel-list__chevron--collapsed]="!expanded()"
        >arrow_drop_down</span
      >
      <span class="material-symbols-outlined">workspaces</span>
      <span class="channel-list__title">Channels</span>
    </button>

    <button
      class="channel-list__add"
      type="button"
      aria-label="Channel erstellen"
      (click)="openDialog()"
    >
      <span class="material-symbols-outlined">add</span>
    </button>
  </header>

  @if (expanded()) {
    <ul class="channel-list__items">
      @for (channel of channels(); track channel.id) {
        <li>
          <app-channel-list-item
            [name]="channel.name"
            [active]="channel.id === activeChannelId()"
            (selected)="channelSelected.emit(channel.id)"
          />
        </li>
      }
      <li>
        <button class="channel-list__create" type="button" (click)="openDialog()">
          <span class="material-symbols-outlined">add_circle</span>
          <span>Channel hinzufügen</span>
        </button>
      </li>
    </ul>
  }
</section>

@if (dialogOpen()) {
  <app-create-channel (closed)="closeDialog()" />
}

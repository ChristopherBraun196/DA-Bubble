<div
  class="add-people"
  role="dialog"
  aria-modal="true"
  aria-labelledby="add-people-title"
  (click)="$event.stopPropagation()"
>
  <header class="add-people__header">
    <h2 class="add-people__title" id="add-people-title">Leute hinzufügen</h2>
    <button class="add-people__close" type="button" aria-label="Schließen" (click)="closed.emit()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </header>

  <form class="add-people__form" (submit)="$event.preventDefault(); create()">
    <label class="add-people__option">
      <input
        type="radio"
        name="add-people-mode"
        value="all"
        [checked]="mode() === 'all'"
        (change)="setMode('all')"
      />
      <span>
        Alle Mitglieder von
        <span class="add-people__channel">{{ sourceChannelName() || 'deinem Channel' }}</span>
        hinzufügen
      </span>
    </label>

    <label class="add-people__option">
      <input
        type="radio"
        name="add-people-mode"
        value="specific"
        [checked]="mode() === 'specific'"
        (change)="setMode('specific')"
      />
      <span>Bestimmte Leute hinzufügen</span>
    </label>

    @if (mode() === 'specific') {
      <div class="add-people__search">
        <div class="add-people__field">
          @for (person of selected(); track person.uid) {
            <span class="add-people__chip">
              <img
                appAvatarFallback
                class="add-people__chip-avatar"
                [src]="person.photoURL"
                alt=""
              />
              <span class="add-people__chip-name">{{ person.displayName }}</span>
              <button
                class="add-people__chip-remove"
                type="button"
                [attr.aria-label]="person.displayName + ' entfernen'"
                (click)="removePerson(person.uid)"
              >
                <span class="material-symbols-outlined">close</span>
              </button>
            </span>
          }

          <input
            class="add-people__input"
            name="person-name"
            type="text"
            autocomplete="off"
            aria-label="Name eingeben"
            [placeholder]="selected().length ? '' : 'Name eingeben'"
            [value]="searchTerm()"
            (input)="updateSearchTerm($event)"
          />
        </div>

        @if (suggestions().length) {
          <ul class="add-people__suggestions">
            @for (person of suggestions(); track person.uid) {
              <li>
                <button class="add-people__suggestion" type="button" (click)="selectPerson(person)">
                  <img
                    appAvatarFallback
                    class="add-people__suggestion-avatar"
                    [src]="person.photoURL"
                    alt=""
                  />
                  <span>{{ person.displayName }}</span>
                </button>
              </li>
            }
          </ul>
        }
      </div>
    }

    @if (addError()) {
      <p class="add-people__error">{{ addError() }}</p>
    }

    <button class="add-people__submit" type="submit" [disabled]="!canCreate() || adding()">
      {{ adding() ? 'Wird gespeichert …' : 'Erstellen' }}
    </button>
  </form>
</div>
